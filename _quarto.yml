project:
  type: book
  output-dir: docs

book:
  title: "Money, Institutions, and Markets"
  author: "Nicolas Cachanosky"
  date: last-modified
  date-format: "MMMM YYYY"
  description: |
    Course readings for ECON 3320 – Money and Banking – The University of Texas at El Paso.
  repo-url: https://github.com/ncachanosky/ECON-3320-online
  repo-actions: [issue]
  repo-branch: main

  site-url: https://ncachanosky.github.io/ECON-3320-online

  open-graph:
    title: "Money, Institutions, and Markets"
    description: "Course readings for ECON 3320 – Money and Banking – The University of Texas at El Paso. An institutions-first treatment of monetary and financial economics."
    image: assets/logo.png

  twitter-card:
    title: "Money, Institutions, and Markets"
    description: "Course readings for ECON 3320 – Money and Banking – The University of Texas at El Paso. An institutions-first treatment of monetary and financial economics."
    image: assets/logo.png
    card-style: summary
    creator: "@n_cachanosky"

  sidebar:
    style: docked
    search: true
    logo: assets/logo.png

  # ── Favicon ───────────────────────────────────────────────────────────────
  # Run favicon_generator.py once to produce favicon.ico, then uncomment:
  favicon: favicon.png

  chapters:
    - index.qmd
    - chapter_01.qmd
    - chapter_02.qmd
    - chapter_03.qmd
    - chapter_04.qmd
    - chapter_05.qmd
    - chapter_06.qmd
    - chapter_07.qmd

  page-footer:
    left: "© Nicolas Cachanosky, The University of Texas at El Paso, Center for Free Enterprise"
    right:
      - icon: github
        href: https://github.com/ncachanosky/ECON-3320-online
      - icon: linkedin
        href: https://www.linkedin.com/in/ncachanosky
      - icon: twitter-x
        href: https://twitter.com/n_cachanosky

format:
  html:
    theme:
      light: flatly
      dark:  darkly
    css: styles.css
    # ss: https://github.com/ncachanosky/EO-styles/blob/e01d07b628f4b0dc15740f40a3b4131240a1eaf7/styles.css
    fontsize: 1.2em
    mainfont: "Georgia, serif"
    highlight-style: github
    code-fold: false
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 2
    smooth-scroll: true
    fig-align: center
    fig-responsive: true
    include-in-header:
      text: |
        <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

bibliography: references.bib
# csl: chicago-author-date.csl