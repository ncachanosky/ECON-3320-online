project:
  type: book
  output-dir: docs

book:
  title: "Money, Institutions, and Markets"
  author: "Nicolas Cachanosky"
  date: last-modified
  date-format: "MMMM YYYY"
  description: |
    Course readings for ECON 3320 – Money and Banking – The University of Texas at El Paso.

  sidebar:
    style: docked
    search: true

  chapters:
    - index.qmd
    - week01.qmd
    - week02.qmd
    - week03.qmd
    - week04.qmd
    - week05.qmd
    - week06.qmd
    - week07.qmd
    - references.qmd

  page-footer:
    left: "© Nicolas Cachanosky, The University of Texas at El Paso, Center for Free Enterprise"
    right:
      - icon: github
        href: https://github.com/ncachanosky/money-institutions-markets

format:
  html:
    theme:
      light: flatly
      dark: darkly
    fontsize: 1.2em
    mainfont: "Georgia, serif"
    highlight-style: github
    code-fold: false
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 2
    smooth-scroll: true
    fig-align: center
    fig-responsive: true
    include-in-header:
      text: |
        <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
        <style>
          /* Navigation sidebar and top navbar — Lato for compact sans-serif */
          .sidebar, .navbar, #quarto-sidebar {
            font-family: Lato, sans-serif;
            font-size: 0.95rem;
            line-height: 1.6;
          }

          /* EO brand: hyperlinks in Copper, no underline */
          a {
            color: #B87333;
            text-decoration: none;
          }
          a:hover {
            color: #B87333;
            text-decoration: underline;
          }

          /* EO brand: callout box accent colors */
          .callout-note      { border-left-color: #5B9BD5; }
          .callout-tip       { border-left-color: #87A96B; }
          .callout-warning   { border-left-color: #D4745E; }
          .callout-important { border-left-color: #B87333; }

          /* EO brand: table header in Copper */
          thead {
            background-color: #B87333;
            color: white;
          }
        </style>

bibliography: references.bib
# csl: chicago-author-date.csl